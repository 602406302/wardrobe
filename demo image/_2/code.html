<script>
        // Micro-interactions for the canvas
        document.querySelectorAll('.clothing-item').forEach(item => {
            let isDragging = false;
            let startX, startY;
            let currentX = 0, currentY = 0;

            item.addEventListener('mousedown', startDragging);
            item.addEventListener('touchstart', (e) => startDragging(e.touches[0]));

            function startDragging(e) {
                isDragging = true;
                startX = e.clientX - currentX;
                startY = e.clientY - currentY;
                item.style.zIndex = '100';
                
                document.addEventListener('mousemove', drag);
                document.addEventListener('touchmove', (e) => drag(e.touches[0]));
                document.addEventListener('mouseup', stopDragging);
                document.addEventListener('touchend', stopDragging);
            }

            function drag(e) {
                if (!isDragging) return;
                currentX = e.clientX - startX;
                currentY = e.clientY - startY;
                item.style.transform = `translate(${currentX}px, ${currentY}px) scale(1.02)`;
            }

            function stopDragging() {
                isDragging = false;
                item.style.zIndex = '10';
                item.style.transform = `translate(${currentX}px, ${currentY}px) scale(1)`;
                document.removeEventListener('mousemove', drag);
                document.removeEventListener('mouseup', stopDragging);
            }
        });

        // Simple Tray filtering logic
        const categoryButtons = document.querySelectorAll('section:last-child div:first-child button');
        categoryButtons.forEach(btn => {
            btn.addEventListener('click', () => {
                categoryButtons.forEach(b => {
                    b.classList.remove('text-primary', 'font-bold', 'border-b-2', 'border-primary');
                    b.classList.add('text-on-surface-variant', 'font-medium');
                });
                btn.classList.add('text-primary', 'font-bold', 'border-b-2', 'border-primary');
                btn.classList.remove('text-on-surface-variant', 'font-medium');
            });
        });
    </script>
