                    "on-primary-fixed-variant": "#293ca0",
                    "surface-container-lowest": "#ffffff",
                    "on-surface": "#1a1c1e",

                    "surface-bright": "#f9f9fc",
                    "outline": "#757684",

                    "on-secondary-fixed": "#0f1e19",

<style>
        body { background-color: #f9f9fc; }
        .glass-panel {
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
        }
        .crop-grid {
            background-image: 
                linear-gradient(to right, rgba(255,255,255,0.3) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(255,255,255,0.3) 1px, transparent 1px);
            background-size: 33.33% 33.33%;
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 300, 'GRAD' 0, 'opsz' 24;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="font-body-lg text-on-surface antialiased min-h-screen flex flex-col">
<!-- Top Navigation Bar -->
<header class="fixed top-0 left-0 w-full z-50 flex justify-between items-center px-container-padding-mobile h-16 bg-surface/70 backdrop-blur-xl border-b border-outline-variant/30">
<button class="flex items-center justify-center w-10 h-10 text-on-surface-variant hover:bg-surface-container-high/50 transition-colors rounded-full">
<span class="material-symbols-outlined">close</span>
</button>
<h1 class="font-headline-lg-mobile text-headline-lg-mobile text-primary tracking-tight">裁剪调整</h1>
<button class="px-4 py-1.5 bg-primary text-on-primary font-bold rounded-full text-label-caps tracking-wider transition-transform active:scale-95">
            保存
        </button>
</header>
<!-- Main Editor Canvas -->
<main class="flex-grow flex flex-col pt-16 pb-32">
<div class="flex-grow flex items-center justify-center p-gutter relative overflow-hidden bg-surface-container-lowest">
<!-- Image Viewport Area -->
<div class="relative w-full max-w-[500px] aspect-[3/4] shadow-sm rounded-xl overflow-hidden border border-outline-variant/20 bg-white group">
<!-- Background Image (Shirt) -->
<div class="absolute inset-0 bg-cover bg-center transition-transform duration-500 ease-out" data-alt="A high-quality, professional product photograph of a crisp white cotton button-down shirt laid flat on a clean, solid light-gray surface. The lighting is bright and even, casting soft, minimal shadows to highlight the fabric texture. The aesthetic is clean and minimalist, following a premium retail wardrobe management app style. The composition is centered, emphasizing organization and clarity." style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuBDvGNyk_4Zq7aerTDuT0Ow4-GdcpSamRL2NApOZd9-XPFtTJZvqa1FE6GSs8BNel9SfQAeFEQ8uSvyPpZPLxXhmPoRLz33ONhEMZw_MaVA9Wh0IpBZwugyp4DFxPOcUEvO1uJtglkyoxDORIkO6p7XiesBXGXAMV-7zp8EN4kOWOpPR7RoPFw8IoTliWZaW2tfi7kFtc6HTE2qa31fx9XKGm567T5n9MHXPJAabAUscj6rfAWTTAel')">
</div>
<!-- Crop Overlay Mask -->
<div class="absolute inset-0 bg-black/40"></div>
<!-- Active Crop Box -->
<div class="absolute top-[10%] left-[10%] w-[80%] h-[80%] border-2 border-white/90 box-border pointer-events-auto cursor-move active:cursor-grabbing">
<!-- Crop Grid Lines -->
<div class="crop-grid w-full h-full"></div>
<!-- Corner Handles -->
<div class="absolute -top-1.5 -left-1.5 w-4 h-4 bg-white rounded-sm"></div>
<div class="absolute -top-1.5 -right-1.5 w-4 h-4 bg-white rounded-sm"></div>
<div class="absolute -bottom-1.5 -left-1.5 w-4 h-4 bg-white rounded-sm"></div>
<div class="absolute -bottom-1.5 -right-1.5 w-4 h-4 bg-white rounded-sm"></div>
</div>
</div>
</div>
</main>
<!-- Bottom Controls & Guidance -->
<footer class="fixed bottom-0 left-0 w-full z-50 bg-surface/70 backdrop-blur-3xl border-t border-outline-variant/20 pb-safe">
<!-- Operation Buttons -->
<div class="flex justify-around items-center px-4 h-20">
<button class="flex flex-col items-center gap-1 group transition-all active:scale-90">
<div class="w-10 h-10 flex items-center justify-center rounded-full border border-outline-variant/30 group-hover:bg-surface-container-high/50 transition-colors">
<span class="material-symbols-outlined text-on-surface-variant">rotate_right</span>
</div>
<span class="text-[10px] font-label-caps text-on-surface-variant uppercase tracking-widest">旋转</span>
</button>
<button class="flex flex-col items-center gap-1 group transition-all active:scale-90">
<div class="w-10 h-10 flex items-center justify-center rounded-full border border-outline-variant/30 group-hover:bg-surface-container-high/50 transition-colors">
<span class="material-symbols-outlined text-on-surface-variant">aspect_ratio</span>
</div>
<span class="text-[10px] font-label-caps text-on-surface-variant uppercase tracking-widest">比例</span>
</button>
<button class="flex flex-col items-center gap-1 group transition-all active:scale-90">
<div class="w-10 h-10 flex items-center justify-center rounded-full border border-outline-variant/30 group-hover:bg-surface-container-high/50 transition-colors">
<span class="material-symbols-outlined text-on-surface-variant">restart_alt</span>
</div>
<span class="text-[10px] font-label-caps text-on-surface-variant uppercase tracking-widest">重置</span>
</button>
</div>
<!-- Guidance Hint -->
<div class="px-6 pb-6 text-center">
<p class="text-body-sm text-outline font-medium opacity-80">
                建议使用纯色背景以获得最佳效果
            </p>
</div>
</footer>
<!-- Micro-interaction Script -->
<script>
        // Simple scale and reset simulation
        const resetBtn = document.querySelector('button:has(.material-symbols-outlined:contains("restart_alt"))');
        const cropBox = document.querySelector('.absolute.top-\\[10\\%\\].left-\\[10\\%\\]');
        
        // Use standard text check for reset button if :contains is not supported
        document.querySelectorAll('button').forEach(btn => {
            if(btn.textContent.includes('restart_alt')) {
                btn.addEventListener('click', () => {
                    cropBox.style.transition = 'all 0.5s cubic-bezier(0.4, 0, 0.2, 1)';
                    cropBox.style.top = '10%';
                    cropBox.style.left = '10%';
                    cropBox.style.width = '80%';
                    cropBox.style.height = '80%';
                    setTimeout(() => cropBox.style.transition = '', 500);
                });
            }
            
            if(btn.textContent.includes('rotate_right')) {
                let rotation = 0;
                btn.addEventListener('click', () => {
                    rotation += 90;
                    const img = document.querySelector('[style*="background-image"]');
                    img.style.transform = `rotate(${rotation}deg)`;
                });
            }
        });
    </script>
</body></html>
